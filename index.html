<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METOC Forecaster - USMC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bg4:#283548;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--primary:#2563eb;--primary2:#1d4ed8;--green:#22c55e;--green-bg:rgba(34,197,94,0.12);--amber:#f59e0b;--amber-bg:rgba(245,158,11,0.12);--red:#ef4444;--red-bg:rgba(239,68,68,0.12);--cyan:#06b6d4;--purple:#a78bfa}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
nav{width:240px;background:var(--bg2);border-right:1px solid var(--bg3);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:10}
nav .logo{padding:16px;border-bottom:1px solid var(--bg3)}
nav .logo h1{font-size:13px;color:#fff;font-weight:700;letter-spacing:0.5px}
nav .logo p{font-size:9px;color:var(--text3);margin-top:2px}
nav .nav-items{flex:1;padding:8px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:500;transition:all 0.15s}
nav a:hover{background:var(--bg3);color:#fff}
nav a.active{background:var(--primary);color:#fff}
nav .loc{padding:12px;border-top:1px solid var(--bg3);font-size:10px;color:var(--text3)}
nav .loc b{color:var(--text);font-size:11px;display:block;margin-bottom:2px}
nav .refresh{padding:12px;border-top:1px solid var(--bg3)}
nav .refresh button{width:100%;padding:8px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
nav .refresh button:hover{background:var(--primary2)}
nav .refresh button:disabled{background:var(--bg3);cursor:wait}
.main{margin-left:240px;flex:1;padding:24px;min-height:100vh}
.header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:18px;font-weight:700}
.header .meta{font-size:11px;color:var(--text3)}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:20px;margin-bottom:16px}
.card-header{background:var(--bg3);margin:-20px -20px 16px;padding:12px 20px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.3px}
.card-header .sub{font-size:9px;color:var(--text2)}
.section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px}
.narrative{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:12px}
.flag-banner{padding:14px 20px;border-radius:10px;display:flex;align-items:center;gap:12px;margin-bottom:16px;border:1px solid}
.flag-banner .flag-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.flag-banner .flag-text{font-weight:700;font-size:13px}
.flag-banner .flag-sub{font-size:11px;color:var(--text2)}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:14px}
.stat .label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat .value{font-size:20px;font-weight:700}
.stat .sub{font-size:10px;color:var(--text2);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:600;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--bg3);position:sticky;top:0;background:var(--bg2)}
td{padding:6px 10px;border-bottom:1px solid rgba(51,65,85,0.4)}
tr:hover{background:rgba(30,41,59,0.5)}
.text-green{color:var(--green)}.text-amber{color:var(--amber)}.text-red{color:var(--red)}.text-cyan{color:var(--cyan)}.text-muted{color:var(--text3)}.text-purple{color:var(--purple)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:0.5px}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,0.3)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{flex:1;padding:8px 12px;border:none;background:none;color:var(--text3);font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;transition:all 0.15s;min-width:80px}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{background:var(--primary);color:#fff}
.tab .alert-dot{color:var(--amber);margin-left:2px}
.warning-card{border-radius:8px;padding:14px 18px;margin-bottom:10px;border:1px solid}
.warning-card .wtype{font-weight:700;font-size:13px;margin-bottom:4px}
.warning-card .wdesc{font-size:12px;opacity:0.8}
.warning-card .wcrit{font-size:10px;opacity:0.5;margin-top:4px}
.synoptic-section{padding:16px 0;border-bottom:1px solid var(--bg3)}
.synoptic-section:last-child{border-bottom:none}
.synoptic-section h4{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.feature-tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:4px;font-size:10px;font-weight:600;margin:2px}
.impact-row{padding:14px 18px;border-bottom:1px solid var(--bg3)}
.impact-row:last-child{border-bottom:none}
.impact-row .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.impact-row .iparam{font-weight:600;font-size:12px}
.impact-row .ithresh{font-size:10px;color:var(--text3);font-family:monospace}
.impact-row .icurr{font-size:10px;color:var(--text2);font-family:monospace}
.impact-row .iimpact{font-size:11px;color:var(--cyan);margin-top:4px}
.loader{text-align:center;padding:60px}
.loader .spin{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:16px;color:var(--red)}
.empty{text-align:center;padding:40px;color:var(--text3)}
.day-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.day-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:14px;text-align:left;cursor:pointer;border-top:3px solid transparent}
.day-card:hover{border-color:var(--primary)}
.day-card .dname{font-size:13px;font-weight:700;color:#fff}
.day-card .ddate{font-size:10px;color:var(--text3)}
.day-card .dtemp{font-size:22px;font-weight:700;color:#fff;margin:6px 0 2px}
.day-card .dtemp2{font-size:12px;color:var(--text3)}
.day-card .dmeta{margin-top:8px;font-size:10px;color:var(--text2);line-height:1.6}
.period-narrative{background:var(--bg);padding:12px 16px;border-radius:6px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.6}
.space-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.space-item{padding:12px;border-bottom:1px solid var(--bg3)}
.space-item:last-child{border:none}
.tz-control{display:flex;align-items:center;gap:8px;margin-top:8px}.tz-control select{flex:1;padding:7px 8px;background:var(--bg);border:1px solid var(--bg3);color:var(--text);border-radius:6px;font-size:11px}.status-line{font-size:10px;color:var(--text3);margin-top:7px}.model-table td,.model-table th{font-size:10px}.confidence{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}.conf-high{background:var(--green-bg);color:var(--green)}.conf-mod{background:var(--amber-bg);color:var(--amber)}.conf-low{background:var(--red-bg);color:var(--red)}
.space-item .si-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.space-item .si-name{font-weight:600;font-size:12px}
.space-item .si-impact{font-size:11px;color:var(--text2);margin-top:2px}
.space-item .si-note{font-size:10px;color:var(--primary);margin-top:4px}
@media(max-width:900px){nav{width:60px}nav a span:not(.icon){display:none}.main{margin-left:60px}.day-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){nav{display:none}.main{margin-left:0}.day-cards{grid-template-columns:1fr}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07111f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raindrop">

<body>
<nav>
  <div class="logo"><h1>METOC FORECASTER</h1><p>MCRP 2-10B.6</p></div>
  <div class="nav-items">
    <a href="#" onclick="showPage('synoptic')" class="active" id="nav-synoptic"><span class="icon">&#128225;</span><span>Synoptic Overview</span></a>
    <a href="#" onclick="showPage('forecast')" id="nav-forecast"><span class="icon">&#128203;</span><span>96-Hour Forecast</span></a>
    <a href="#" onclick="showPage('current')" id="nav-current"><span class="icon">&#127777;</span><span>Current Conditions</span></a>
    <a href="#" onclick="showPage('impacts')" id="nav-impacts"><span class="icon">&#9888;</span><span>Operational Impacts</span></a>
    <a href="#" onclick="showPage('warnings')" id="nav-warnings"><span class="icon">&#128680;</span><span>Warnings</span></a>
    <a href="#" onclick="showPage('charts')" id="nav-charts"><span class="icon">&#128200;</span><span>Charts</span></a>
  </div>
  <div class="loc" id="loc-info"><b>MCAS Futenma</b>26.27N 127.77E | ROTM</div>
  <div class="refresh">
    <div class="section-title">DISPLAY TIME</div>
    <div class="tz-control"><select id="tzSel" onchange="setTimezone(this.value)"></select></div>
    <div class="status-line" id="refresh-status">Auto-refresh: 30 min</div>
    <button id="refreshBtn" onclick="loadData()" style="margin-top:8px">REFRESH DATA</button>
  </div>
</nav>
<div class="main" id="main-content">
  <div class="header"><h2 id="page-title">Synoptic Overview</h2><div class="meta" id="page-meta"></div></div>
  <div id="page-content"><div class="loader"><div class="spin"></div><p style="color:var(--text3);font-size:13px">Fetching weather data...</p></div></div>
</div>

<script>
const INSTALLATIONS=[
  {name:'MCAS Futenma',code:'ROTM',lat:26.2736,lon:127.7611,elev:25,tz:'Asia/Tokyo'},
  {name:'Camp Hansen',code:'HANS',lat:26.4583,lon:127.7667,elev:45,tz:'Asia/Tokyo'},
  {name:'Camp Schwab',code:'SCHW',lat:26.5333,lon:127.9833,elev:10,tz:'Asia/Tokyo'},
  {name:'Camp Foster',code:'FOST',lat:26.3283,lon:127.7756,elev:60,tz:'Asia/Tokyo'},
  {name:'MCAS Iwakuni',code:'IWA',lat:34.1439,lon:132.2358,elev:2,tz:'Asia/Tokyo'},
  {name:'Camp Blaz, Guam',code:'BLAZ',lat:13.5833,lon:144.8667,elev:80,tz:'Pacific/Guam'},
  {name:'MCAS Miramar',code:'MIRA',lat:32.8684,lon:-117.1434,elev:137,tz:'America/Los_Angeles'},
  {name:'MCB Camp Pendleton',code:'PEND',lat:33.3019,lon:-117.3489,elev:24,tz:'America/Los_Angeles'},
  {name:'MCB Camp Lejeune',code:'LEJE',lat:34.6196,lon:-77.3814,elev:3,tz:'America/New_York'},
  {name:'MCAS Beaufort',code:'BEAU',lat:32.4774,lon:-80.7231,elev:9,tz:'America/New_York'},
  {name:'MCB Quantico',code:'QUAN',lat:38.5028,lon:-77.3147,elev:20,tz:'America/New_York'},
  {name:'MCAS Cherry Point',code:'CHPT',lat:34.901,lon:-76.8809,elev:9,tz:'America/New_York'},
  {name:'MCAS Yuma',code:'YUMA',lat:32.6564,lon:-114.6058,elev:63,tz:'America/Phoenix'}
];
let loc=INSTALLATIONS[0],data=null,currentPage='synoptic';
let displayTZ='Asia/Tokyo',autoRefreshTimer=null,lastRefreshMs=0;
const TZ_OPTIONS=[['JST','Asia/Tokyo'],['Z / UTC','UTC'],['Installation Local','LOCAL'],['Guam / ChST','Pacific/Guam'],['Pacific Time','America/Los_Angeles'],['Mountain Time','America/Phoenix'],['Central Time','America/Chicago'],['Eastern Time','America/New_York']];
function effectiveTZ(){return displayTZ==='LOCAL'?(loc.tz||'UTC'):displayTZ}
function fmtLocal(s,opts={}){try{return new Intl.DateTimeFormat('en-US',{timeZone:effectiveTZ(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,...opts}).format(new Date(s))}catch{return String(s)}}
function tzLabel(){return displayTZ==='LOCAL'?'LOCAL':(TZ_OPTIONS.find(x=>x[1]===displayTZ)?.[0]||displayTZ)}
function setTimezone(v){displayTZ=v;render()}
function initTZ(){const el=document.getElementById('tzSel');if(el)el.innerHTML=TZ_OPTIONS.map(([n,v])=>`<option value="${v}" ${v===displayTZ?'selected':''}>${n}</option>`).join('')}
function startAutoRefresh(){if(autoRefreshTimer)clearInterval(autoRefreshTimer);autoRefreshTimer=setInterval(()=>{if(!lastRefreshMs)return;const now=Date.now(),a=new Date(lastRefreshMs),b=new Date(now),dayChanged=a.getUTCDate()!==b.getUTCDate()||a.getUTCMonth()!==b.getUTCMonth()||a.getUTCFullYear()!==b.getUTCFullYear();if(document.visibilityState==='visible'&&(dayChanged||now-lastRefreshMs>=30*60*1000))loadData(true)},5*60*1000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&data&&Date.now()-lastRefreshMs>10*60*1000)loadData(true)})
initTZ();startAutoRefresh();

function showPage(p){
  currentPage=p;
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById('nav-'+p).classList.add('active');
  render();
}

async function loadData(silent=false){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;btn.textContent='FETCHING...';
  if(!silent)document.getElementById('page-content').innerHTML='<div class="loader"><div class="spin"></div><p style="color:var(--text3);font-size:13px">Generating METOC product...</p></div>';
  const rs=document.getElementById('refresh-status');if(rs)rs.textContent='Refreshing '+tzLabel()+' data...';
  try{
    const[h,d,day,marine,sw,upper]=await Promise.all([
      fetchHourly(loc.lat,loc.lon),fetchCurrent(loc.lat,loc.lon),fetchDaily(loc.lat,loc.lon),
      fetchMarine(loc.lat,loc.lon).catch(()=>null),fetchSW().catch(()=>null),fetchAtmosphericModels(loc.lat,loc.lon).catch(()=>null)
    ]);
    data={hourly:h,cur:d,daily:day,marine:marine,space:sw,upper:upper,synoptic:genSynoptic(h,day,d,marine,upper),
      impacts:genImpacts(h,day,marine,d,upper),flags:genFlag(h),warnings:genWarnings(h,marine),
      swImpacts:sw?genSWImpacts(sw):[]};
    lastRefreshMs=Date.now(); document.getElementById('page-meta').textContent='Updated: '+fmtLocal(new Date().toISOString())+' '+tzLabel()+' | Valid: 96 hours | Auto-refresh 30 min';
    render();
  }catch(e){
    document.getElementById('page-content').innerHTML='<div class="error-box"><b>Retrieval Error</b><br>'+e.message+'<br><small>Check network and try again.</small></div>';
  }
  btn.disabled=false;btn.textContent='REFRESH DATA'; const rs2=document.getElementById('refresh-status');if(rs2)rs2.textContent='Last refresh: '+fmtLocal(new Date().toISOString())+' '+tzLabel()+' | Auto-refresh: 30 min';
}

async function fetchCurrent(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,dewpoint_2m,precipitation,weathercode,cloudcover,windspeed_10m,winddirection_10m,windgusts_10m,surface_pressure,visibility&timezone=auto`);
  const j=await r.json();
  if(!j.current)throw new Error('API returned no current data: '+JSON.stringify(j).substring(0,200));
  const c=j.current;
  return{temp:c.temperature_2m,dew:c.dewpoint_2m,rh:c.relative_humidity_2m,wd:c.winddirection_10m,
    ws:Math.round((c.windspeed_10m||0)*0.539957),wg:c.windgusts_10m?Math.round(c.windgusts_10m*0.539957):0,
    cloud:c.cloudcover||0,vis:c.visibility?c.visibility/1609.344:10,press:c.surface_pressure||1013,wxc:decodeWMO(c.weathercode||0),time:c.time||new Date().toISOString()};
}
async function fetchHourly(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,dewpoint_2m,precipitation_probability,precipitation,weathercode,cloudcover,windspeed_10m,winddirection_10m,windgusts_10m,surface_pressure,visibility,uv_index,shortwave_radiation&timezone=auto&forecast_days=4`);
  const j=await r.json();
  if(!j.hourly||!j.hourly.time)throw new Error('API returned no hourly data: '+JSON.stringify(j).substring(0,200));
  const h=j.hourly;const out=[];
  for(let i=0;i<Math.min(h.time.length,96);i++)out.push({
    time:h.time[i],temp:h.temperature_2m[i]||0,dew:h.dewpoint_2m[i]||0,rh:h.relative_humidity_2m[i]||0,
    pp:h.precipitation_probability[i]||0,pc:h.precipitation[i]||0,wmo:h.weathercode[i]||0,
    cloud:h.cloudcover[i]||0,ws:Math.round((h.windspeed_10m[i]||0)*0.539957),
    wd:h.winddirection_10m[i]||0,wg:h.windgusts_10m[i]?Math.round(h.windgusts_10m[i]*0.539957):0,
    vis:h.visibility&&h.visibility[i]!=null?h.visibility[i]/1609.344:10,uv:h.uv_index?h.uv_index[i]||0:0,sr:h.shortwave_radiation?h.shortwave_radiation[i]||0:0,
    pres:h.surface_pressure?h.surface_pressure[i]||1013:1013,wxc:decodeWMO(h.weathercode?h.weathercode[i]||0:0)
  });
  return out;
}
async function fetchDaily(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,precipitation_hours,weathercode,windspeed_10m_max,windgusts_10m_max,winddirection_10m_dominant,uv_index_max,sunrise,sunset,daylight_duration,moonrise,moonset,moon_phase&timezone=auto&forecast_days=4`);
  const j=await r.json();
  if(!j.daily||!j.daily.time)throw new Error('API returned no daily data: '+JSON.stringify(j).substring(0,200));
  const d=j.daily;
  return d.time.map((dt,i)=>({date:dt,tmax:d.temperature_2m_max[i]||0,tmin:d.temperature_2m_min[i]||0,
    amax:d.temperature_2m_max[i]||0,amin:d.temperature_2m_min[i]||0,
    pcSum:d.precipitation_sum?d.precipitation_sum[i]||0:0,ppMax:d.precipitation_probability_max?d.precipitation_probability_max[i]||0:0,pcHrs:d.precipitation_hours?d.precipitation_hours[i]||0:0,
    wmo:d.weathercode?d.weathercode[i]||0:0,wsMax:Math.round((d.windspeed_10m_max?d.windspeed_10m_max[i]||0:0)*0.539957),
    wgMax:Math.round((d.windgusts_10m_max?d.windgusts_10m_max[i]||0:0)*0.539957),wdDom:d.winddirection_10m_dominant?d.winddirection_10m_dominant[i]||0:0,
    uvMax:d.uv_index_max?d.uv_index_max[i]||0:0,sunrise:d.sunrise?d.sunrise[i]||'': '',sunset:d.sunset?d.sunset[i]||'': '',dayLen:d.daylight_duration?d.daylight_duration[i]||0:0,
    mrise:d.moonrise?d.moonrise[i]||'':'',mset:d.moonset?d.moonset[i]||'':'',moonPh:d.moon_phase?d.moon_phase[i]||0:0,
    moonIl:Math.round((d.moon_phase?d.moon_phase[i]||0:0)*100),srMax:0}));
}
async function fetchMarine(lat,lon){
  const r=await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,ocean_current_velocity,ocean_current_direction`);
  if(!r.ok)return null;const j=await r.json();const m=j.current||{};
  return{wh:m.wave_height?m.wave_height*3.28084:null,wd:m.wave_direction,wp:m.wave_period,
    sh:m.swell_wave_height?m.swell_wave_height*3.28084:null,sd:m.swell_wave_direction,sp:m.swell_wave_period,
    cv:m.ocean_current_velocity?m.ocean_current_velocity*1.94384:null,cd:m.ocean_current_direction,
    sst:null};
}
async function fetchSW(){
  try{
    const[kr]=await Promise.all([fetch('https://services.swpc.noaa.gov/products/planetary-k-index.json').then(r=>r.json()).catch(()=>[])]);
    let kp=0;if(Array.isArray(kr)&&kr.length>0){kp=parseFloat(kr[kr.length-1]?.kp_index||'0')}

function genSynoptic(h,d,c,m,upper){
  const ap=h.reduce((s,x)=>s+x.pres,0)/h.length;
  const tp=Math.max(...d.map(x=>x.tmax));
  const tn=Math.min(...d.map(x=>x.tmin));
  const tot=d.reduce((s,x)=>s+x.pcSum,0);
  const aw=h.reduce((s,x)=>s+x.ws,0)/h.length;
  const mg=Math.max(...h.map(x=>x.wg));
  const ac=h.reduce((s,x)=>s+x.cloud,0)/h.length;
  const lat=loc.lat,lon=loc.lon;
  const isTrop=lat<30&&lon>100;
  const features=[];

  if(ap>1015&&ac<40)features.push({t:'subtropical_high',desc:'A broad area of high pressure is positioned over the region, producing subsidence and suppressed cloud development.',imp:'Fair weather. Good visibility. Favorable for flight ops.'});
  if(ap<1008)features.push({t:'low_pressure',desc:'Low pressure dominant with large-scale lift and moisture convergence.',imp:'Reduced ceilings/visibility. IFR likely. Possible thunderstorms.'});
  if(isTrop&&tot>5)features.push({t:'monsoon_trough',desc:'Active monsoon trough producing widespread convection and moisture transport.',imp:'Persistent cloudiness, rain, gusty winds near convective cells.'});
  if((tp-tn)>10&&!isTrop)features.push({t:'front',desc:'Frontal system influencing the area with temperature gradients and wind shifts.',imp:'Wind shifts and gusts along boundary. Precipitation periods.'});
  if(aw>20||mg>30)features.push({t:'jet',desc:'Upper-level momentum transfer enhancing surface winds.',imp:'Elevated sustained winds and gusts. SCA warranted.'});
  if(h.some(x=>x.pres<995)&&lat<25)features.push({t:'tropical_system',desc:'Tropical disturbance influencing weather. Deep convection present.',imp:'Dangerous conditions possible. Monitor JTWC.'});

  let upperText,surf,trop,enso,lower,modelText,confidence='LOW';
  if(isTrop){
    upperText=`The upper-level pattern over the western Pacific is dominated by the Western North Pacific Subtropical High (WNPSH) at 500mb. The 5880gpm contour extends across the region, with its western ridge controlling steering currents and moisture transport. At 300mb, the Polar Front Jet is displaced well north at its weakest seasonal position, with core speeds of 30-50 kt. The Subtropical Jet at 200mb is weak and diffuse, with no significant coupling with mid-latitude troughs. An upper-level anticyclone provides favorable outflow divergence for tropical features on its equatorward flank.`;
    trop=ap<1008?`Active tropical convection is present. The monsoon trough extends across the western Pacific, providing a favorable environment for tropical cyclone development. Deep convective clusters producing heavy rain and gusty winds. Monitor JTWC advisories.`:`The monsoon trough is present but displaced from the immediate area. No organized tropical cyclones expected within 96 hours. However, favorable SSTs above 28C support isolated convective development. Continue monitoring JTWC.`;
  }else{
    upperText=`The 500mb pattern shows a progressive flow with shortwave troughs embedded in the westerlies. Jet stream active at 200-300mb with core speeds of 80-120 kt, providing dynamic lift for surface systems. A ridge-trough-ridge pattern producing alternating fair and unsettled weather.`;
    trop=`Tropical cyclone activity is not a significant factor for the forecast area. No tropical systems forecast to impact the region within 96 hours.`;
  }
  const m500=upper?.models?.ECMWF?.h||{};
  const t850=meanValid(m500.temperature_850hPa?.slice(0,24));
  const rh850=meanValid(m500.relative_humidity_850hPa?.slice(0,24));
  const w850=meanValid(m500.wind_speed_850hPa?.slice(0,24));
  lower=`850mb: ${t850!=null?t850.toFixed(1)+'C / ':''}${rh850!=null?Math.round(rh850)+'% RH / ':''}${w850!=null?Math.round(w850*0.539957)+' kt':''}. ${rh850!=null&&rh850>75?'Deep low-level moisture is supportive of cloud/convective development.':'Low-level moisture is not exceptionally high.'}`;
  modelText=upper?.discussion?.summary||'Multi-model guidance unavailable.';
  confidence=upper?.discussion?.confidence||'LOW';
  surf=`Surface analysis shows ${ap>1015?'high pressure dominating with a ridge extending across the region':ap<1008?'broad low pressure with multiple embedded troughs':'a relatively uniform pressure field'}. Winds ${aw>20?'strong':aw>12?'moderate':'light'} from the ${windDir(h[Math.floor(h.length/4)]?.wd||180)} quadrant at ${Math.round(aw)} kt sustained${mg>aw*1.3?` with gusts to ${mg} kt`:''}. Temperatures ranging from ${Math.round(tn)}C to ${Math.round(tp)}C. ${tot>10?'Significant precipitation expected.':'Precipitation chances limited.'}`;
  enso=`ENSO conditions are being monitored. El Nino tends to shift typhoon activity eastward with more storms developing further from landmass. La Nina weights genesis westward. Seasonal forecasts from NOAA should be referenced for long-range planning.`;

  return{upper:upperText,surf,trop,enso,lower,modelText,confidence,features,issued:new Date().toISOString()};
}

function renderForecast(){
  if(!data)return;let h='';
  const days=data.daily;
  h+=`<div class="card"><div class="card-header"><h3>96-HOUR FORECAST</h3><div class="sub">${loc.name} (${loc.code})</div></div></div>`;
  h+=`<div class="day-cards">`;
  days.forEach((dy,i)=>{
    const dt=new Date(dy.date);const dn=dt.toLocaleDateString('en-US',{weekday:'short'});const ds=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    h+=`<div class="day-card" onclick="document.getElementById('period-${i}').scrollIntoView({behavior:'smooth'})"><div class="dname">${dn}</div><div class="ddate">${ds}</div><div class="dtemp">${Math.round(dy.tmax)}&deg;C</div><div class="dtemp2">${Math.round(dy.tmin)}&deg;C</div><div class="dmeta">Wind: ${dy.wsMax}kt G${dy.wgMax}<br>Precip: ${dy.pcSum>0?dy.pcSum.toFixed(1)+'mm':'Dry'}<br>Sun: ${fmtZ(dy.sunrise)}/${fmtZ(dy.sunset)}<br>UV: ${dy.uvMax.toFixed(1)}</div></div>`});
  h+=`</div>`;

  for(let pi=0;pi<4;pi++){
    const start=pi*24,end=Math.min(start+24,data.hourly.length);
    const ph=data.hourly.slice(start,end);if(!ph.length)continue;
    const dy=days[pi];
    h+=`<div class="card" id="period-${pi}"><div class="card-header"><h3>${pi===0?'24-HOUR':(pi+1)*24+'-HOUR'} FORECAST</h3><div class="sub">VALID: ${fmtZ(ph[0].time)} \u2014 ${fmtZ(ph[ph.length-1].time)}</div></div>`;
    if(dy){
      h+=`<div class="period-narrative">Temperatures ${Math.round(dy.tmin)}C to ${Math.round(dy.tmax)}C. Winds ${windDir(dy.wdDom)} at ${dy.wsMax}kt gusts ${dy.wgMax}kt. ${dy.pcSum>0?'Precipitation: '+dy.pcSum.toFixed(1)+'mm.':'Dry conditions.'} Sunrise ${fmtZ(dy.sunrise)}, Sunset ${fmtZ(dy.sunset)}. Moon: ${moonName(dy.moonPh)} (${Math.round(dy.moonIl)}%).</div>`}

    ph.forEach((hr,i)=>{
      if(i%3!==0&&i!==ph.length-1)return;
      const t=new Date(hr.time);const hrZ=fmtLocal(hr.time,{hour:'2-digit',minute:'2-digit'})+' '+tzLabel();
      const cc=hr.cloud>87?'text-muted':hr.cloud>50?'':'text-green';
      h+=`<tr><td style="font-family:monospace;color:var(--text)">${hrZ}</td><td>${Math.round(hr.temp)}C</td><td class="text-muted">${Math.round(hr.dew)}C</td><td class="${cc}">${cloudDesc(hr.cloud)} ${hr.cloud}%</td><td>${windDir(hr.wd)} ${hr.ws}kt</td><td class="${hr.wg>25?'text-amber':''}">${hr.wg?hr.wg+'kt':'-'}</td><td class="text-muted">${hr.vis>=10?'10+':hr.vis.toFixed(1)}</td><td class="${hr.pc>0?'text-cyan':'text-muted'}">${hr.pc>0?hr.pc.toFixed(1)+'mm':'-'}</td><td class="${hr.pp>50?'text-cyan':hr.pp>25?'':'text-muted'}">${hr.pp}%</td><td class="text-muted">${hr.wxc.substring(0,12)}</td><td style="font-family:monospace" class="text-muted">${Math.round(hr.pres)}</td></tr>`});
    h+=`</tbody></table></div>`;
    if(dy){
      h+=`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px;padding:12px;background:var(--bg);border-radius:6px;text-align:center">`;
      [{l:'Sunrise',v:fmtZ(dy.sunrise)},{l:'Sunset',v:fmtZ(dy.sunset)},{l:'Moon Rise',v:dy.mrise?fmtZ(dy.mrise):'---'},{l:'Moon Set',v:dy.mset?fmtZ(dy.mset):'---'},{l:'Moon Phase',v:moonName(dy.moonPh),s:Math.round(dy.moonIl)+'%'},{l:'UV Index',v:dy.uvMax.toFixed(1),s:dy.uvMax>8?'VERY HIGH':dy.uvMax>5?'HIGH':'MOD'}].forEach(x=>{
        h+=`<div><div class="section-title">${x.l}</div><div style="font-size:12px;color:var(--text)">${x.v}</div>${x.s?`<div style="font-size:9px;color:var(--text3)">${x.s}</div>`:''}</div>`});

  document.getElementById('page-content').innerHTML=h;

function showImpTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');

function renderImpTab(tab,I){
  const ti=I.filter(x=>x.wf===tab);if(!ti.length)return'<div class="empty">No parameters assessed.</div>';
  let h='';ti.forEach(x=>{

    h+=`<div class="impact-row"><div class="ihead"><span class="iparam">${x.p}</span><span class="badge ${bc}">${x.s}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px"><div><span class="ithresh">Threshold: ${x.th}</span></div><div><span class="icurr">Current: ${x.cur}</span></div></div><p class="iimpact">IMPACT: ${x.txt}</p></div>`});

function renderCharts(){
  if(!data)return;const h=data.hourly;
  const temps=h.map(x=>x.temp),dews=h.map(x=>x.dew),winds=h.map(x=>x.ws),gusts=h.map(x=>x.wg);
  const clouds=h.map(x=>x.cloud),precips=h.map(x=>x.pc);
  const mnT=Math.min(...temps),mxT=Math.max(...temps),mxW=Math.max(...gusts,...winds,1),mxP=Math.max(...precips,1);

  function polyLine(vals,mn,mx,h){
    return vals.map((v,i)=>`${(i/(vals.length-1))*940},${h-10-(((v-mn)/Math.max(mx-mn,1))*(h-30))}`).join(' ');
  }

  let svg1=`<svg viewBox="0 0 960 220" style="width:100%;height:220px">`;
  for(let i=0;i<5;i++)svg1+=`<line x1="0" y1="${i*50+10}" x2="950" y2="${i*50+10}" stroke="#334155" stroke-width="0.5"/>`;
  svg1+=`<polyline points="${polyLine(temps,mnT,mxT,210)}" fill="none" stroke="#ef4444" stroke-width="2"/>`;
  svg1+=`<polyline points="${polyLine(dews,mnT,mxT,210)}" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>`;
  svg1+=`<text x="10" y="15" fill="#ef4444" font-size="11">Temperature</text><text x="100" y="15" fill="#06b6d4" font-size="11">Dewpoint</text>`;
  svg1+=`<text x="10" y="215" fill="#64748b" font-size="10">${Math.round(mxT)}C</text><text x="880" y="215" fill="#64748b" font-size="10">${Math.round(mnT)}C</text></svg>`;

  let svg2=`<svg viewBox="0 0 960 220" style="width:100%;height:220px">`;
  for(let i=0;i<5;i++)svg2+=`<line x1="0" y1="${i*50+10}" x2="950" y2="${i*50+10}" stroke="#334155" stroke-width="0.5"/>`;
  svg2+=`<polyline points="${polyLine(winds,0,mxW,210)}" fill="none" stroke="#22c55e" stroke-width="2"/>`;
  svg2+=`<polyline points="${polyLine(gusts,0,mxW,210)}" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>`;
  svg2+=`<text x="10" y="15" fill="#22c55e" font-size="11">Sustained</text><text x="90" y="15" fill="#f59e0b" font-size="11">Gusts</text></svg>`;

  let bars3=`<svg viewBox="0 0 960 220" style="width:100%;height:220px">`;
  for(let i=0;i<5;i++)bars3+=`<line x1="0" y1="${i*50+10}" x2="950" y2="${i*50+10}" stroke="#334155" stroke-width="0.5"/>`;
  clouds.forEach((cc,i)=>{const bw=960/clouds.length-1;bars3+=`<rect x="${(i/clouds.length)*960}" y="${200-(cc/100)*180}" width="${bw}" height="${(cc/100)*180}" fill="${cc>87?'#4b5563':cc>50?'#6b7280':cc>25?'#9ca3af':'#22c55e'}" opacity="0.35"/>`});
  precips.forEach((p,i)=>{if(p>0){const bw=960/precips.length-1;bars3+=`<rect x="${(i/precips.length)*960}" y="${200-(p/mxP)*120}" width="${bw}" height="${(p/mxP)*120}" fill="#3b82f6" opacity="0.6"/>`}});
  bars3+=`<text x="10" y="15" fill="#6b7280" font-size="11">Cloud Cover %</text><text x="130" y="15" fill="#3b82f6" font-size="11">Precipitation mm</text></svg>`;

  let h2=`<div class="card"><h4 class="section-title">Temperature & Dewpoint (96-Hour)</h4>${svg1}</div>`;
  h2+=`<div class="card"><h4 class="section-title">Wind Speed & Gusts (96-Hour)</h4>${svg2}</div>`;
  h2+=`<div class="card"><h4 class="section-title">Cloud Cover & Precipitation (96-Hour)</h4>${bars3}</div>`;

  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const counts=Array(16).fill(0),spds=Array(16).fill(0);
  h.forEach(x=>{const idx=Math.round(x.wd/22.5)%16;counts[idx]++;spds[idx]+=x.ws});
  const mxAvg=Math.max(...spds.map((s,i)=>counts[i]?s/counts[i]:0));
  let rose=`<svg viewBox="0 0 300 300" style="width:220px;height:220px">`;
  [1,2,3,4].forEach(i=>{rose+=`<circle cx="150" cy="150" r="${i*30}" fill="none" stroke="#334155" stroke-width="0.5"/>`});
  dirs.forEach((_,i)=>{const a=(i*22.5-90)*Math.PI/180;rose+=`<line x1="150" y1="150" x2="${150+120*Math.cos(a)}" y2="${150+120*Math.sin(a)}" stroke="#334155" stroke-width="0.5"/>`});
  dirs.forEach((_,i)=>{const a=(i*22.5-90)*Math.PI/180;const avg=counts[i]?spds[i]/counts[i]:0;const bl=mxAvg?avg/mxAvg*100:0;if(bl<1)return;rose+=`<line x1="150" y1="150" x2="${150+bl*Math.cos(a)}" y2="${150+bl*Math.sin(a)}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>`});
  dirs.forEach((d,i)=>{const a=(i*22.5-90)*Math.PI/180;rose+=`<text x="${150+135*Math.cos(a)}" y="${150+135*Math.sin(a)}" fill="#94a3b8" font-size="8" text-anchor="middle" dominant-baseline="middle">${d}</text>`});
  rose+=`</svg>`;
  h2+=`<div class="card"><h4 class="section-title">Wind Rose (96-Hour)</h4><div style="display:flex;justify-content:center">${rose}</div></div>`;

  document.getElementById('page-content').innerHTML=h2;
}

loadData();
</script>
